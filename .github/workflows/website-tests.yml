name: Website tests (NurseConnect + Hospital)

# Jobs
#   validate      no secrets. Validates YAML + environments + approvals integrity and runs the agent's own tests.
#   discover      manual only. Mints a short-lived READ-ONLY GitHub App token, checks out the two private app repos
#                 into apps/nurseconnect and apps/hospital, revokes the token, runs static discovery and draft generation.
#                 Output is an artifact for HUMAN review - nothing is committed, approved or executed by this job.
#   agent-tests   runs APPROVED YAML workflows read-only (one matrix entry per app), after the approval gate.
#   agent-write   manual only, behind the protected GitHub Environment "staging-write" (required reviewers).
#   nurseconnect / hospital   the original pytest phases (unchanged behaviour; read-only unless a VERIFIED staging env is configured).
#
# Third-party actions are pinned to exact release versions. Before you rely on this in production, replace each
# `@vX.Y.Z` with the full commit SHA of that release (see docs/GITHUB_APP_SETUP.md, "Pinning actions").

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      phase:
        description: "legacy pytest phase: health | login | discovery | pages | forms | permissions | workflows | all"
        default: "all"
      run_discovery:
        description: "Run source discovery + draft generation (needs the GitHub App secrets)"
        type: boolean
        default: false
      allow_write:
        description: "Run write-enabled workflows on STAGING (needs the staging-write environment approval)"
        type: boolean
        default: false
      confirm_write_ids:
        description: "Comma-separated workflow ids explicitly confirmed for writing (only used with allow_write)"
        default: ""

# Minimal token permissions for every job unless a job asks for less/more. No job needs more than read.
permissions:
  contents: read

concurrency:
  group: website-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PHASE: ${{ github.event.inputs.phase || 'all' }}
  SCREENSHOT_MODE: masked
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.3.0
        with: { python-version: "3.11", cache: pip }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci.txt
          playwright install --with-deps chromium
      - name: Validate workflow YAML, environments and approval audit chain
        run: python agent.py validate --environments
      - name: Agent self-tests (local server, synthetic data only)
        run: python -m pytest agent_tests -q -p no:cacheprovider

  discover:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_discovery }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      NURSECONNECT_APP_REPO: ${{ vars.NURSECONNECT_APP_REPO }}
      HOSPITAL_APP_REPO: ${{ vars.HOSPITAL_APP_REPO }}
      NURSECONNECT_WORKFLOW_SPEC: ${{ vars.NURSECONNECT_WORKFLOW_SPEC }}
      HOSPITAL_WORKFLOW_SPEC: ${{ vars.HOSPITAL_WORKFLOW_SPEC }}
      QA_COMPILER_MODEL: ${{ vars.QA_COMPILER_MODEL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Fail safely if required secrets / variables are missing
        run: |
          missing=""
          for n in GH_APP_ID GH_APP_INSTALLATION_ID GH_APP_PRIVATE_KEY NURSECONNECT_APP_REPO HOSPITAL_APP_REPO; do
            if [ -z "${!n}" ]; then missing="$missing $n"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing required secret/variable(s):$missing - see docs/GITHUB_APP_SETUP.md. Nothing was checked out."
            exit 1
          fi
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.3.0
        with: { python-version: "3.11", cache: pip }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-ci.txt
          playwright install --with-deps chromium
      - name: Mint short-lived read-only installation token
        id: app
        run: python tools/github_app_token.py mint --repo "$NURSECONNECT_APP_REPO" --repo "$HOSPITAL_APP_REPO"
      - name: Check out NurseConnect application (read-only)
        uses: actions/checkout@v4.2.2
        with:
          repository: ${{ vars.NURSECONNECT_APP_REPO }}
          token: ${{ steps.app.outputs.token }}
          path: apps/nurseconnect
          persist-credentials: false
          fetch-depth: 1
      - name: Check out Hospital application (read-only)
        uses: actions/checkout@v4.2.2
        with:
          repository: ${{ vars.HOSPITAL_APP_REPO }}
          token: ${{ steps.app.outputs.token }}
          path: apps/hospital
          persist-credentials: false
          fetch-depth: 1
      - name: Revoke the token now that checkout is done
        if: ${{ always() && steps.app.outputs.token != '' }}
        env:
          GH_APP_TOKEN: ${{ steps.app.outputs.token }}
        run: python tools/github_app_token.py revoke
      - name: Static discovery (no application code is executed, no token needed)
        run: python agent.py discover --app nurseconnect=apps/nurseconnect --app hospital=apps/hospital --strict
      - name: Generate DRAFT workflows (not approved, not executable)
        run: python agent.py draft
      - name: Compile changed semantic workflow documents for both apps (draft-only)
        shell: bash
        run: |
          for app in nurseconnect hospital; do
            if [[ "$app" == "nurseconnect" ]]; then spec="$NURSECONNECT_WORKFLOW_SPEC"; else spec="$HOSPITAL_WORKFLOW_SPEC"; fi
            if [[ -z "$spec" ]]; then continue; fi
            if [[ ! -f "$spec" ]]; then echo "::error::Missing $app specification: $spec"; exit 1; fi
            args=(--spec "$spec" --app "$app" --repo "$app=apps/$app" --refresh)
            if [[ -n "$QA_COMPILER_MODEL" ]]; then
              if [[ -z "$OPENAI_API_KEY" ]]; then echo "::error::QA_COMPILER_MODEL configured without OPENAI_API_KEY"; exit 1; fi
              pip install -r requirements-ai.txt
              args+=(--model "$QA_COMPILER_MODEL")
            fi
            python agent.py compile-spec "${args[@]}"
          done
      - name: Validate drafts against the strict generated-draft rules
        run: |
          files=$(find workflow_drafts -name '*.yml' | sort)
          if [ -n "$files" ]; then
            args=""; for f in $files; do args="$args --file $f"; done
            python agent.py validate --drafts $args
          fi
      - name: Redact and scan outputs before upload
        run: |
          python agent.py scan-artifacts artifacts/discovery --fix
          python agent.py scan-artifacts workflow_drafts --fix
      - uses: actions/upload-artifact@v4.4.3
        continue-on-error: true
        with:
          name: discovery-and-drafts
          path: |
            artifacts/discovery/
            workflow_drafts/
          retention-days: 3
          if-no-files-found: error

  agent-tests:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [nurseconnect, hospital]
    env:
      TEST_ENV: ${{ vars.TEST_ENV_NAME }}          # empty = unverified environment => strictly read-only
      NURSE_EMAIL: ${{ secrets.NURSE_EMAIL }}
      NURSE_PASSWORD: ${{ secrets.NURSE_PASSWORD }}
      CONSUMER_EMAIL: ${{ secrets.CONSUMER_EMAIL }}
      CONSUMER_PASSWORD: ${{ secrets.CONSUMER_PASSWORD }}
      RECEPTION_EMAIL: ${{ secrets.RECEPTION_EMAIL }}
      RECEPTION_PASSWORD: ${{ secrets.RECEPTION_PASSWORD }}
      DOCTOR_EMAIL: ${{ secrets.DOCTOR_EMAIL }}
      DOCTOR_PASSWORD: ${{ secrets.DOCTOR_PASSWORD }}
      APP_ONLY: ${{ matrix.app }}
      FAIL_ON_INCOMPLETE: ${{ vars.AGENT_FAIL_ON_INCOMPLETE }}   # the ONLY switch for --fail-on-incomplete: 'true' = any NOT VERIFIED/NOT TESTED fails the job (default: only critical ones)
      WORKFLOW_SPEC: ${{ matrix.app == 'nurseconnect' && vars.NURSECONNECT_WORKFLOW_SPEC || vars.HOSPITAL_WORKFLOW_SPEC }}
      # Same login paths as the pytest jobs - without these the agent falls back to "/" and finds no password field.
      NURSECONNECT_LOGIN_PATH: ${{ vars.NURSECONNECT_LOGIN_PATH || '/auth/login' }}
      HOSPITAL_LOGIN_PATH: ${{ vars.HOSPITAL_LOGIN_PATH || '/login' }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.3.0
        with: { python-version: "3.11", cache: pip }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Approval gate (fails if any workflow is unapproved or changed after approval)
        run: python agent.py check-approvals
      - name: Run approved workflows (read-only; reject stale spec versions)
        shell: bash
        env:
          # HIMS role credentials: visible ONLY to this step (not install/checkout/upload steps) and ONLY on the hospital leg;
          # the NurseConnect leg receives empty strings. Create as SECRETS (synthetic test accounts). Names must match config.py AGENT_ROLES.
          HIMS_LAB_EMAIL: ${{ matrix.app == 'hospital' && secrets.HIMS_LAB_EMAIL || '' }}
          HIMS_LAB_PASSWORD: ${{ matrix.app == 'hospital' && secrets.HIMS_LAB_PASSWORD || '' }}
          HIMS_RADIOLOGY_EMAIL: ${{ matrix.app == 'hospital' && secrets.HIMS_RADIOLOGY_EMAIL || '' }}
          HIMS_RADIOLOGY_PASSWORD: ${{ matrix.app == 'hospital' && secrets.HIMS_RADIOLOGY_PASSWORD || '' }}
          HIMS_PHARMACY_EMAIL: ${{ matrix.app == 'hospital' && secrets.HIMS_PHARMACY_EMAIL || '' }}
          HIMS_PHARMACY_PASSWORD: ${{ matrix.app == 'hospital' && secrets.HIMS_PHARMACY_PASSWORD || '' }}
          HIMS_FINANCE_EMAIL: ${{ matrix.app == 'hospital' && secrets.HIMS_FINANCE_EMAIL || '' }}
          HIMS_FINANCE_PASSWORD: ${{ matrix.app == 'hospital' && secrets.HIMS_FINANCE_PASSWORD || '' }}
          HIMS_HR_EMAIL: ${{ matrix.app == 'hospital' && secrets.HIMS_HR_EMAIL || '' }}
          HIMS_HR_PASSWORD: ${{ matrix.app == 'hospital' && secrets.HIMS_HR_PASSWORD || '' }}
          HIMS_NURSE_EMAIL: ${{ matrix.app == 'hospital' && secrets.HIMS_NURSE_EMAIL || '' }}
          HIMS_NURSE_PASSWORD: ${{ matrix.app == 'hospital' && secrets.HIMS_NURSE_PASSWORD || '' }}
          HIMS_HOSPITAL_ADMIN_EMAIL: ${{ matrix.app == 'hospital' && secrets.HIMS_HOSPITAL_ADMIN_EMAIL || '' }}
          HIMS_HOSPITAL_ADMIN_PASSWORD: ${{ matrix.app == 'hospital' && secrets.HIMS_HOSPITAL_ADMIN_PASSWORD || '' }}
          HIMS_SUPER_ADMIN_EMAIL: ${{ matrix.app == 'hospital' && secrets.HIMS_SUPER_ADMIN_EMAIL || '' }}
          HIMS_SUPER_ADMIN_PASSWORD: ${{ matrix.app == 'hospital' && secrets.HIMS_SUPER_ADMIN_PASSWORD || '' }}
        run: |
          # Always applied (with or without WORKFLOW_SPEC): a credential/config block or a CRITICAL NOT VERIFIED
          # workflow must never produce a green job. Only intentionally unapproved drafts are tolerated (still reported).
          args=(--app "$APP_ONLY" --read-only --fail-on-blocked --ignore-blocked unapproved --fail-on-critical-unverified)
          if [[ "$FAIL_ON_INCOMPLETE" == "true" ]]; then args+=(--fail-on-incomplete); fi
          if [[ -n "$TEST_ENV" ]]; then args+=(--env "$TEST_ENV"); fi
          if [[ -n "$WORKFLOW_SPEC" ]]; then
            if [[ ! -f "$WORKFLOW_SPEC" ]]; then echo "::error::Missing workflow document $WORKFLOW_SPEC"; exit 1; fi
            args+=(--spec "$WORKFLOW_SPEC")
          fi
          python agent.py run "${args[@]}"
      - name: Redact and scan reports
        id: report_scan
        if: always()
        env:
          # Same values as the run step so the scanner can redact them from reports (it also learns them from the environment).
          HIMS_LAB_EMAIL: ${{ matrix.app == 'hospital' && secrets.HIMS_LAB_EMAIL || '' }}
          HIMS_LAB_PASSWORD: ${{ matrix.app == 'hospital' && secrets.HIMS_LAB_PASSWORD || '' }}
          HIMS_RADIOLOGY_EMAIL: ${{ matrix.app == 'hospital' && secrets.HIMS_RADIOLOGY_EMAIL || '' }}
          HIMS_RADIOLOGY_PASSWORD: ${{ matrix.app == 'hospital' && secrets.HIMS_RADIOLOGY_PASSWORD || '' }}
          HIMS_PHARMACY_EMAIL: ${{ matrix.app == 'hospital' && secrets.HIMS_PHARMACY_EMAIL || '' }}
          HIMS_PHARMACY_PASSWORD: ${{ matrix.app == 'hospital' && secrets.HIMS_PHARMACY_PASSWORD || '' }}
          HIMS_FINANCE_EMAIL: ${{ matrix.app == 'hospital' && secrets.HIMS_FINANCE_EMAIL || '' }}
          HIMS_FINANCE_PASSWORD: ${{ matrix.app == 'hospital' && secrets.HIMS_FINANCE_PASSWORD || '' }}
          HIMS_HR_EMAIL: ${{ matrix.app == 'hospital' && secrets.HIMS_HR_EMAIL || '' }}
          HIMS_HR_PASSWORD: ${{ matrix.app == 'hospital' && secrets.HIMS_HR_PASSWORD || '' }}
          HIMS_NURSE_EMAIL: ${{ matrix.app == 'hospital' && secrets.HIMS_NURSE_EMAIL || '' }}
          HIMS_NURSE_PASSWORD: ${{ matrix.app == 'hospital' && secrets.HIMS_NURSE_PASSWORD || '' }}
          HIMS_HOSPITAL_ADMIN_EMAIL: ${{ matrix.app == 'hospital' && secrets.HIMS_HOSPITAL_ADMIN_EMAIL || '' }}
          HIMS_HOSPITAL_ADMIN_PASSWORD: ${{ matrix.app == 'hospital' && secrets.HIMS_HOSPITAL_ADMIN_PASSWORD || '' }}
          HIMS_SUPER_ADMIN_EMAIL: ${{ matrix.app == 'hospital' && secrets.HIMS_SUPER_ADMIN_EMAIL || '' }}
          HIMS_SUPER_ADMIN_PASSWORD: ${{ matrix.app == 'hospital' && secrets.HIMS_SUPER_ADMIN_PASSWORD || '' }}
        run: python agent.py scan-artifacts artifacts --fix
      - name: Copy redacted report to the job summary (evidence survives an artifact-quota failure)
        if: ${{ always() && steps.report_scan.outcome == 'success' }}
        shell: bash
        run: |
          f=$(ls -t artifacts/reports/agent_report_*.md 2>/dev/null | head -n1 || true)
          if [[ -n "$f" ]]; then { echo "### Agent report (${{ matrix.app }})"; echo; head -c 900000 "$f"; } >> "$GITHUB_STEP_SUMMARY"; fi
      # Small, high-value reports (HTML + JSON + markdown) kept longer, in their own artifact so they are never lost
      # together with bulky evidence. All files were redacted/scanned by the previous step.
      - uses: actions/upload-artifact@v4.4.3
        continue-on-error: true
        if: ${{ always() && steps.report_scan.outcome == 'success' }}
        with:
          name: agent-report-${{ matrix.app }}
          path: |
            artifacts/reports/*.html
            artifacts/reports/*.json
            artifacts/reports/*.md
          retention-days: 7
          compression-level: 9
          if-no-files-found: warn
      # Bulky evidence (screenshots etc.): short retention to protect the storage quota; never excludes the reports above.
      - uses: actions/upload-artifact@v4.4.3
        continue-on-error: true
        if: ${{ always() && steps.report_scan.outcome == 'success' }}
        with:
          name: agent-evidence-${{ matrix.app }}
          path: |
            artifacts/
            !artifacts/reports/*.html
            !artifacts/reports/*.json
            !artifacts/reports/*.md
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore

  agent-write:
    # Never automatic. Needs: manual dispatch + allow_write + approval by the reviewers of the "staging-write" Environment.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_write }}
    needs: agent-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging-write
    concurrency:
      group: staging-write-${{ vars.STAGING_ENV_NAME }}      # one write run per staging environment at a time
      cancel-in-progress: false
    env:
      TEST_ENV: ${{ vars.STAGING_ENV_NAME }}
      STAGING_WRITE_CONFIRMATION: ${{ secrets.STAGING_WRITE_CONFIRMATION }}
      ALLOW_WRITE_TESTS: "true"
      CONFIRM_IDS: ${{ inputs.confirm_write_ids }}
      NURSE_EMAIL: ${{ secrets.STAGING_NURSE_EMAIL }}
      NURSE_PASSWORD: ${{ secrets.STAGING_NURSE_PASSWORD }}
      CONSUMER_EMAIL: ${{ secrets.STAGING_CONSUMER_EMAIL }}
      CONSUMER_PASSWORD: ${{ secrets.STAGING_CONSUMER_PASSWORD }}
      RECEPTION_EMAIL: ${{ secrets.STAGING_RECEPTION_EMAIL }}
      RECEPTION_PASSWORD: ${{ secrets.STAGING_RECEPTION_PASSWORD }}
      DOCTOR_EMAIL: ${{ secrets.STAGING_DOCTOR_EMAIL }}
      DOCTOR_PASSWORD: ${{ secrets.STAGING_DOCTOR_PASSWORD }}
      OPS_EMAIL: ${{ secrets.STAGING_OPS_EMAIL }}
      OPS_PASSWORD: ${{ secrets.STAGING_OPS_PASSWORD }}
      REVIEWER_EMAIL: ${{ secrets.STAGING_REVIEWER_EMAIL }}
      REVIEWER_PASSWORD: ${{ secrets.STAGING_REVIEWER_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
      LOCKOUT_EMAIL: ${{ secrets.STAGING_LOCKOUT_EMAIL }}          # dedicated throw-away account used by the lockout test
      LOCKOUT_PASSWORD: ${{ secrets.STAGING_LOCKOUT_PASSWORD }}
    steps:
      - name: Fail safely if staging configuration is missing
        run: |
          for n in TEST_ENV STAGING_WRITE_CONFIRMATION CONFIRM_IDS; do
            if [ -z "${!n}" ]; then echo "::error::$n is empty - refusing to run write tests (see docs/STAGING_AND_SECURITY.md)"; exit 1; fi
          done
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.3.0
        with: { python-version: "3.11", cache: pip }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Approval gate
        run: python agent.py check-approvals
      - name: Verify the environment is declared staging (fail closed)
        run: |
          python agent.py verify-env --env "$TEST_ENV" --app nurseconnect
          python agent.py verify-env --env "$TEST_ENV" --app hospital
      - name: Run confirmed write workflows on staging
        run: |
          args=""
          IFS=',' read -ra ids <<< "$CONFIRM_IDS"
          for i in "${ids[@]}"; do args="$args --confirm-write $(echo "$i" | tr -d ' ') --workflow $(echo "$i" | tr -d ' ')"; done
          python agent.py run --env "$TEST_ENV" --app all --allow-write --fail-on-blocked $args
      - name: Redact and scan reports
        id: report_scan
        if: always()
        run: python agent.py scan-artifacts artifacts --fix
      - uses: actions/upload-artifact@v4.4.3
        continue-on-error: true
        if: ${{ always() && steps.report_scan.outcome == 'success' }}
        with:
          name: agent-write-report
          path: artifacts/reports/
          retention-days: 3
          if-no-files-found: ignore

  # ------------------------------------------------------------------ original pytest phases (unchanged behaviour)
  nurseconnect:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ONLY: nurseconnect
      FAIL_ON_FINDINGS: "false"   
      NURSE_EMAIL: ${{ secrets.NURSE_EMAIL }}
      NURSE_PASSWORD: ${{ secrets.NURSE_PASSWORD }}
      CONSUMER_EMAIL: ${{ secrets.CONSUMER_EMAIL }}
      CONSUMER_PASSWORD: ${{ secrets.CONSUMER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.3.0
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: python run.py --phase "$PHASE"
      - name: Redact and scan reports
        id: report_scan
        if: always()
        run: python agent.py scan-artifacts artifacts --fix
      - uses: actions/upload-artifact@v4.4.3
        continue-on-error: true
        if: ${{ always() && steps.report_scan.outcome == 'success' }}
        with:
          name: nurseconnect-report
          path: |
            artifacts/
            !artifacts/screenshots/
          retention-days: 3
          compression-level: 9
      # Screenshots are the bulk of the storage: keep them for 1 day only (the report/log artifact above keeps 3).
      - uses: actions/upload-artifact@v4.4.3
        continue-on-error: true
        if: ${{ always() && steps.report_scan.outcome == 'success' }}
        with:
          name: nurseconnect-screenshots
          path: artifacts/screenshots/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore

  # 2nd site: starts only after the first finished (even if it failed)
  hospital:
    needs: validate
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ONLY: hospital
      FAIL_ON_FINDINGS: "false"   # hospital findings (HTTP, console errors) are tracked in the report, not by a red job
      HOSPITAL_LOGIN_PATH: ${{ vars.HOSPITAL_LOGIN_PATH || '/login' }}
      RECEPTION_EMAIL: ${{ secrets.RECEPTION_EMAIL }}
      RECEPTION_PASSWORD: ${{ secrets.RECEPTION_PASSWORD }}
      DOCTOR_EMAIL: ${{ secrets.DOCTOR_EMAIL }}
      DOCTOR_PASSWORD: ${{ secrets.DOCTOR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5.3.0
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: python run.py --phase "$PHASE"
      - name: Redact and scan reports
        id: report_scan
        if: always()
        run: python agent.py scan-artifacts artifacts --fix
      - uses: actions/upload-artifact@v4.4.3
        continue-on-error: true
        if: ${{ always() && steps.report_scan.outcome == 'success' }}
        with:
          name: hospital-report
          path: |
            artifacts/
            !artifacts/screenshots/
          retention-days: 3
          compression-level: 9
      # Screenshots are the bulk of the storage: keep them for 1 day only (the report/log artifact above keeps 3).
      - uses: actions/upload-artifact@v4.4.3
        continue-on-error: true
        if: ${{ always() && steps.report_scan.outcome == 'success' }}
        with:
          name: hospital-screenshots
          path: artifacts/screenshots/
          retention-days: 1
          compression-level: 9
          if-no-files-found: ignore