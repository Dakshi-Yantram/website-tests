# NurseConnect end-to-end + edge-case + security workflows  (agent schema v1, see docs/WORKFLOW_SCHEMA.md)
#
# STATUS: every workflow is `draft`. Nothing here runs until a human reviews it and approves it:
#     python agent.py validate --drafts --file workflow_drafts/nurseconnect/e2e_edge_security.yml
#     python agent.py approve --file workflow_drafts/nurseconnect/e2e_edge_security.yml --by "<you>" --reason "<why>" --i-understand-this-writes
#
# HOW THE CHAIN WORKS: workflows run one after another in this file's order inside ONE `agent.py run` (one run id).
# {{MARKER}} / {{SYNTH_NAME}} are identical for all workflows of that run, so the customer leg creates a booking named
# "AUTOTEST <run>" and the later nurse / operations / reviewer / admin legs open that same record by that text.
#
# SELECTORS: login fields use the legacy suite's proven selectors. Menu items use `open_section` (BLOCKED, not FAIL, if absent).
# Everything marked "# VERIFY" is a best guess from the screens you described (no application source was available when this
# was written). On the first staging run a wrong guess shows as FAIL "Element not found ..." - fix the YAML line (no code change).
#
# SAFETY: writes need a declared staging environment + confirmations (docs/STAGING_AND_SECURITY.md). `staging_only: true`
# workflows (brute force / lockout) are BLOCKED on production and on any environment that is not declared staging/local.
# No payment, cancel, delete, logout or messaging element is ever clicked (the agent refuses them).
version: 1


workflows:

  - id: e2e_01_customer_books_care_package
    app: nurseconnect
    title: "Customer: choose a care package and request a booking (stops before payment)"
    description: "Creates ONE booking request named with the synthetic run name. The flow stops before any payment step; the agent never clicks pay/checkout."
    status: draft
    risk: medium
    writes: true
    role: consumer
    tags: [chain]
    preconditions:
      - "Declared staging environment"
      - "Synthetic data only"
    expected_outcome:
      - "Server accepts the booking request"
      - "Booking is listed for the customer"
      - "No payment is made"
    steps:
      - {action: open_section, pattern: "care package|package|service", expected: "Care packages page opens"}
      - {action: click, target: {role: link, name: "Book"}, expected: "Open the first package's booking form  # VERIFY"}
      - {action: fill, target: {label: Patient Name}, value: "{{SYNTH_NAME}}", expected: "Synthetic patient name  # VERIFY label"}
      - {action: fill, target: {label: Phone}, value: "{{SYNTH_PHONE}}", expected: "Synthetic phone  # VERIFY label"}
      - {action: fill, target: {label: Notes}, value: "{{MARKER}}", expected: "Marker in notes  # VERIFY label"}
      - {action: submit, target: {role: button, name: Request Booking}, expected: "Booking request saved (no payment)  # VERIFY button"}
      - {action: expect_text, contains: "{{SYNTH_NAME}}", expected: "Booking shows the synthetic patient name"}
      - {action: screenshot, name: e2e_01_booking_created, expected: "Evidence screenshot (masked)"}

  - id: e2e_02_customer_sees_booking_after_reload
    app: nurseconnect
    title: "Customer: the booking is still there after a full reload"
    description: "Persistence check: the booking created in the previous workflow survives a reload and a fresh navigation."
    status: draft
    risk: low
    writes: false
    role: consumer
    tags: [chain]
    preconditions:
      - "Workflow e2e_01 ran in the same run"
    expected_outcome:
      - "Booking persists server-side"
    steps:
      - {action: open_section, pattern: "booking|appointment|my care|orders", expected: "Bookings list opens  # VERIFY menu name"}
      - {action: press, target: {css: body}, key: F5, expected: "Reload the page"}
      - {action: expect_text, contains: "{{SYNTH_NAME}}", expected: "Booking still listed after reload"}
      - {action: screenshot, name: e2e_02_after_reload, expected: "Evidence screenshot (masked)"}

  - id: e2e_03_operations_sees_new_booking
    app: nurseconnect
    title: "Operations: the customer's new booking appears in the operations queue"
    description: "Customer -> Operations hand-off. Read-only."
    status: draft
    risk: low
    writes: false
    role: operations
    tags: [chain]
    preconditions:
      - "e2e_01 ran in the same run"
      - "OPS_EMAIL / OPS_PASSWORD set"
    expected_outcome:
      - "Booking is visible to operations"
    steps:
      - {action: open_section, pattern: "booking|request|order|queue|dashboard", expected: "Operations queue opens  # VERIFY menu name"}
      - {action: expect_text, contains: "{{SYNTH_NAME}}", expected: "New booking visible to operations"}
      - {action: screenshot, name: e2e_03_ops_queue, expected: "Evidence screenshot (masked)"}

  - id: e2e_04_operations_assigns_nurse
    app: nurseconnect
    title: "Operations: open the booking and assign the test nurse"
    description: "Operations -> Nurse hand-off. Writes one assignment."
    status: draft
    risk: medium
    writes: true
    role: operations
    tags: [chain]
    preconditions:
      - "e2e_03 ran"
      - "A dedicated staging test nurse exists"
    expected_outcome:
      - "Booking status becomes assigned to the test nurse"
    steps:
      - {action: open_section, pattern: "booking|request|order|queue|dashboard", expected: "Operations queue opens  # VERIFY"}
      - {action: click, target: {text: "{{SYNTH_NAME}}"}, expected: "Open the synthetic booking"}
      - {action: click, target: {role: button, name: Assign}, expected: "Open the assign dialog  # VERIFY"}
      - {action: click, target: {role: option, name: "Test Nurse", nth: 0}, expected: "Pick the dedicated staging test nurse  # VERIFY option label"}
      - {action: submit, target: {role: button, name: Confirm Assignment}, expected: "Assignment saved  # VERIFY"}
      - {action: expect_text, contains: "Assigned", expected: "Status shows assigned  # VERIFY wording"}
      - {action: screenshot, name: e2e_04_assigned, expected: "Evidence screenshot (masked)"}

  - id: e2e_05_nurse_sees_assignment
    app: nurseconnect
    title: "Nurse: the assignment appears under Workspace > Assignments"
    description: "Operations -> Nurse hand-off, nurse side. Read-only."
    status: draft
    risk: low
    writes: false
    role: nurse
    tags: [chain]
    preconditions:
      - "e2e_04 ran"
    expected_outcome:
      - "Nurse sees exactly the assigned booking"
    steps:
      - {action: open_section, pattern: "Assignments", expected: "Assignments page opens"}
      - {action: expect_text, contains: "{{SYNTH_NAME}}", expected: "Assignment for the synthetic patient is listed"}
      - {action: screenshot, name: e2e_05_nurse_assignments, expected: "Evidence screenshot (masked)"}

  - id: e2e_06_nurse_accepts_assignment
    app: nurseconnect
    title: "Nurse: accept the assignment"
    description: "Writes one status change (accepted)."
    status: draft
    risk: medium
    writes: true
    role: nurse
    tags: [chain]
    preconditions:
      - "e2e_05 ran"
    expected_outcome:
      - "Status persists as accepted"
    steps:
      - {action: open_section, pattern: "Assignments", expected: "Assignments page opens"}
      - {action: click, target: {text: "{{SYNTH_NAME}}"}, expected: "Open the synthetic assignment"}
      - {action: submit, target: {role: button, name: Accept}, expected: "Assignment accepted  # VERIFY"}
      - {action: expect_text, contains: "Accepted", expected: "Status shows accepted  # VERIFY wording"}
      - {action: press, target: {css: body}, key: F5, expected: "Reload"}
      - {action: expect_text, contains: "Accepted", expected: "Accepted status persists after reload"}
      - {action: screenshot, name: e2e_06_accepted, expected: "Evidence screenshot (masked)"}

  - id: e2e_07_nurse_documents_visit
    app: nurseconnect
    title: "Nurse: Visits > open the visit > save documentation, then reopen"
    description: "Writes one documentation note containing the run marker and verifies it after reopening."
    status: draft
    risk: medium
    writes: true
    role: nurse
    tags: [chain]
    preconditions:
      - "e2e_06 ran"
    expected_outcome:
      - "Note is stored on the correct visit and shows after reload"
    steps:
      - {action: open_section, pattern: "Visits", expected: "Visits page opens"}
      - {action: click, target: {text: "{{SYNTH_NAME}}"}, expected: "Open the synthetic visit"}
      - {action: open_section, pattern: "Documentation", expected: "Documentation tab opens"}
      - {action: fill, target: {label: Notes}, value: "{{MARKER}} synthetic visit note", expected: "Synthetic note  # VERIFY label"}
      - {action: submit, target: {role: button, name: Save}, expected: "Note saved  # VERIFY"}
      - {action: press, target: {css: body}, key: F5, expected: "Reload"}
      - {action: expect_text, contains: "{{MARKER}}", expected: "Saved note is present after reload (persistence, not just a toast)"}
      - {action: screenshot, name: e2e_07_documented, expected: "Evidence screenshot (masked)"}

  - id: e2e_08_nurse_submits_documentation_for_review
    app: nurseconnect
    title: "Nurse: submit the documentation to the reviewer"
    description: "Nurse -> Reviewer hand-off. Writes one status change."
    status: draft
    risk: medium
    writes: true
    role: nurse
    tags: [chain]
    preconditions:
      - "e2e_07 ran"
    expected_outcome:
      - "Documentation is locked / pending review"
    steps:
      - {action: open_section, pattern: "Documentation", expected: "Documentation page opens"}
      - {action: click, target: {text: "{{SYNTH_NAME}}"}, expected: "Open the synthetic documentation"}
      - {action: submit, target: {role: button, name: Submit for Review}, expected: "Submitted  # VERIFY"}
      - {action: expect_text, contains: "Pending", expected: "Status shows pending review  # VERIFY wording"}
      - {action: screenshot, name: e2e_08_submitted, expected: "Evidence screenshot (masked)"}

  - id: e2e_09_reviewer_sees_submission
    app: nurseconnect
    title: "Reviewer: the submitted documentation appears in the review queue"
    description: "Nurse -> Reviewer hand-off, reviewer side. Read-only."
    status: draft
    risk: low
    writes: false
    role: reviewer
    tags: [chain]
    preconditions:
      - "e2e_08 ran"
      - "REVIEWER_EMAIL / REVIEWER_PASSWORD set"
    expected_outcome:
      - "Reviewer sees the correct submission"
    steps:
      - {action: open_section, pattern: "review|queue|pending|documentation", expected: "Review queue opens  # VERIFY menu name"}
      - {action: expect_text, contains: "{{SYNTH_NAME}}", expected: "Submission visible to the reviewer"}
      - {action: expect_text, contains: "{{MARKER}}", expected: "Note content visible to the reviewer"}
      - {action: screenshot, name: e2e_09_review_queue, expected: "Evidence screenshot (masked)"}

  - id: e2e_10_reviewer_requests_changes
    app: nurseconnect
    title: "Reviewer: request changes with a comment"
    description: "Reviewer -> Nurse feedback loop. Writes one review decision."
    status: draft
    risk: medium
    writes: true
    role: reviewer
    tags: [chain]
    preconditions:
      - "e2e_09 ran"
    expected_outcome:
      - "Decision stored with the comment"
    steps:
      - {action: open_section, pattern: "review|queue|pending|documentation", expected: "Review queue opens  # VERIFY"}
      - {action: click, target: {text: "{{SYNTH_NAME}}"}, expected: "Open the submission"}
      - {action: fill, target: {label: Comment}, value: "{{MARKER}} please add vitals", expected: "Review comment  # VERIFY label"}
      - {action: submit, target: {role: button, name: Request Changes}, expected: "Decision saved  # VERIFY"}
      - {action: expect_text, contains: "Changes requested", expected: "Status shows changes requested  # VERIFY wording"}
      - {action: screenshot, name: e2e_10_changes_requested, expected: "Evidence screenshot (masked)"}

  - id: e2e_11_nurse_sees_review_feedback
    app: nurseconnect
    title: "Nurse: the reviewer's feedback is visible and the note is editable again"
    description: "Reviewer -> Nurse hand-off. Read-only."
    status: draft
    risk: low
    writes: false
    role: nurse
    tags: [chain]
    preconditions:
      - "e2e_10 ran"
    expected_outcome:
      - "Nurse sees the reviewer comment"
    steps:
      - {action: open_section, pattern: "Documentation", expected: "Documentation page opens"}
      - {action: click, target: {text: "{{SYNTH_NAME}}"}, expected: "Open the synthetic documentation"}
      - {action: expect_text, contains: "please add vitals", expected: "Reviewer comment is visible to the nurse"}
      - {action: screenshot, name: e2e_11_feedback_seen, expected: "Evidence screenshot (masked)"}

  - id: e2e_12_nurse_resubmits_and_reviewer_approves
    app: nurseconnect
    title: "Nurse: add vitals and resubmit"
    description: "Writes an update and a status change."
    status: draft
    risk: medium
    writes: true
    role: nurse
    tags: [chain]
    preconditions:
      - "e2e_11 ran"
    expected_outcome:
      - "Resubmission accepted"
    steps:
      - {action: open_section, pattern: "Documentation", expected: "Documentation page opens"}
      - {action: click, target: {text: "{{SYNTH_NAME}}"}, expected: "Open the synthetic documentation"}
      - {action: fill, target: {label: Notes}, value: "{{MARKER}} vitals recorded", expected: "Updated synthetic note  # VERIFY label"}
      - {action: submit, target: {role: button, name: Submit for Review}, expected: "Resubmitted  # VERIFY"}
      - {action: expect_text, contains: "Pending", expected: "Status shows pending review again  # VERIFY wording"}

  - id: e2e_13_reviewer_approves_documentation
    app: nurseconnect
    title: "Reviewer: approve the resubmitted documentation"
    description: "Writes one approval decision."
    status: draft
    risk: medium
    writes: true
    role: reviewer
    tags: [chain]
    preconditions:
      - "e2e_12 ran"
    expected_outcome:
      - "Documentation approved and persisted"
    steps:
      - {action: open_section, pattern: "review|queue|pending|documentation", expected: "Review queue opens  # VERIFY"}
      - {action: click, target: {text: "{{SYNTH_NAME}}"}, expected: "Open the submission"}
      - {action: submit, target: {role: button, name: Approve}, expected: "Approved  # VERIFY"}
      - {action: expect_text, contains: "Approved", expected: "Status shows approved  # VERIFY wording"}
      - {action: press, target: {css: body}, key: F5, expected: "Reload"}
      - {action: expect_text, contains: "Approved", expected: "Approval persists after reload"}
      - {action: screenshot, name: e2e_13_approved, expected: "Evidence screenshot (masked)"}

  - id: e2e_14_customer_sees_completed_visit_summary
    app: nurseconnect
    title: "Customer: the booking now reflects the nurse's approved work"
    description: "Closes the loop customer -> operations -> nurse -> reviewer -> customer. Read-only."
    status: draft
    risk: low
    writes: false
    role: consumer
    tags: [chain]
    preconditions:
      - "e2e_13 ran"
    expected_outcome:
      - "Customer sees the final status"
    steps:
      - {action: open_section, pattern: "booking|appointment|my care|orders", expected: "Bookings list opens  # VERIFY"}
      - {action: click, target: {text: "{{SYNTH_NAME}}"}, expected: "Open the booking"}
      - {action: expect_text, contains: "Completed", expected: "Booking status reflects completion  # VERIFY wording"}
      - {action: screenshot, name: e2e_14_customer_final, expected: "Evidence screenshot (masked)"}

  - id: e2e_15_admin_sees_nurse_and_activity
    app: nurseconnect
    title: "Admin: nurse record and the booking activity are visible to the admin"
    description: "Nurse <-> Admin. Read-only. Admin write actions (approve / suspend a nurse) are not included: see docs/NURSECONNECT_E2E_TEST_PLAN.md."
    status: draft
    risk: low
    writes: false
    role: admin
    tags: [chain]
    preconditions:
      - "e2e_13 ran"
      - "ADMIN_EMAIL / ADMIN_PASSWORD set"
    expected_outcome:
      - "Admin has visibility across the chain"
    steps:
      - {action: open_section, pattern: "nurse|partner|staff|users", expected: "Nurse management page opens  # VERIFY menu name"}
      - {action: expect_text, contains: "Test Nurse", expected: "Dedicated test nurse is listed  # VERIFY"}
      - {action: open_section, pattern: "booking|request|order|report", expected: "Bookings / reports page opens  # VERIFY"}
      - {action: expect_text, contains: "{{SYNTH_NAME}}", expected: "Booking visible to the admin"}
      - {action: screenshot, name: e2e_15_admin_view, expected: "Evidence screenshot (masked)"}

  - id: e2e_16_nurse_access_matches_admin_status
    app: nurseconnect
    title: "Nurse: an active, approved nurse can open the workspace (admin-controlled status takes effect)"
    description: "Nurse <-> Admin. Read-only. Confirms the nurse account the admin manages can reach Workspace, Assignments, Visits and Documentation."
    status: draft
    risk: low
    writes: false
    role: nurse
    tags: [chain]
    preconditions:
      - "Declared staging environment"
      - "Synthetic data only"
    expected_outcome:
      - "All four nurse pages open"
    steps:
      - {action: expect_authenticated, expected: "Nurse is logged in"}
      - {action: open_section, pattern: "Workspace", expected: "Workspace opens"}
      - {action: open_section, pattern: "Assignments", expected: "Assignments opens"}
      - {action: open_section, pattern: "Visits", expected: "Visits opens"}
      - {action: open_section, pattern: "Documentation", expected: "Documentation opens"}
      - {action: expect_url, contains: "/partner", expected: "Nurse stays in the partner area"}

  - id: edge_01_booking_empty_required_fields
    app: nurseconnect
    title: "Edge: booking form refuses empty required fields (no request is sent)"
    description: "All non-GET requests are blocked at the network layer, so this never writes."
    status: draft
    risk: low
    writes: false
    role: consumer
    tags: [edge]
    preconditions:
      - "Declared staging environment"
      - "Synthetic data only"
    expected_outcome:
      - "Validation blocks the empty form"
    steps:
      - {action: open_section, pattern: "care package|package|service", expected: "Care packages page opens"}
      - {action: click, target: {role: link, name: "Book"}, expected: "Open booking form  # VERIFY"}
      - {action: guarded_submit, target: {role: button, name: Request Booking}, expected: "Submit with nothing filled  # VERIFY"}
      - {action: expect_text, contains: "required", expected: "A 'required' validation message appears  # VERIFY wording"}
      - {action: expect_no_writes_sent, expected: "Nothing was sent to the server"}

  - id: edge_02_booking_malformed_phone
    app: nurseconnect
    title: "Edge: malformed phone numbers are rejected"
    description: "Letters and a too-short number. Blocked from writing."
    status: draft
    risk: low
    writes: false
    role: consumer
    tags: [edge]
    preconditions:
      - "Declared staging environment"
      - "Synthetic data only"
    expected_outcome:
      - "Invalid phone numbers never reach the server"
    steps:
      - {action: open_section, pattern: "care package|package|service", expected: "Care packages page opens"}
      - {action: click, target: {role: link, name: "Book"}, expected: "Open booking form  # VERIFY"}
      - {action: fill, target: {label: Patient Name}, value: "{{SYNTH_NAME}}", expected: "Name  # VERIFY label"}
      - {action: fill, target: {label: Phone}, value: "abc123", expected: "Letters in phone  # VERIFY label"}
      - {action: guarded_submit, target: {role: button, name: Request Booking}, expected: "Submit"}
      - {action: expect_text, matches: "phone|mobile|number", expected: "Phone validation message"}
      - {action: fill, target: {label: Phone}, value: "12345", expected: "Too-short number"}
      - {action: guarded_submit, target: {role: button, name: Request Booking}, expected: "Submit"}
      - {action: expect_text, matches: "phone|mobile|number|10", expected: "Phone length validation message"}
      - {action: expect_no_writes_sent, expected: "Nothing was sent to the server"}

  - id: edge_03_booking_very_long_text
    app: nurseconnect
    title: "Edge: very long text in the notes field is limited or rejected, not crashed on"
    description: "About 1,400 characters made from the run marker. Blocked from writing."
    status: draft
    risk: low
    writes: false
    role: consumer
    tags: [edge]
    preconditions:
      - "Declared staging environment"
      - "Synthetic data only"
    expected_outcome:
      - "Long input handled cleanly"
    steps:
      - {action: open_section, pattern: "care package|package|service", expected: "Care packages page opens"}
      - {action: click, target: {role: link, name: "Book"}, expected: "Open booking form  # VERIFY"}
      - {action: fill, target: {label: Notes}, value: "{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}{{MARKER}}", expected: "Long notes  # VERIFY label"}
      - {action: guarded_submit, target: {role: button, name: Request Booking}, expected: "Submit"}
      - {action: expect_hidden, target: {text: "Internal Server Error"}, expected: "No server error page"}
      - {action: expect_hidden, target: {text: "Something went wrong"}, expected: "No generic crash message  # VERIFY wording"}

  - id: edge_04_booking_html_is_escaped
    app: nurseconnect
    title: "Edge/Security: HTML typed into the notes field is shown as text, not rendered"
    description: "Stored-XSS check. Writes one booking whose notes contain a bold tag; the tag must appear literally."
    status: draft
    risk: medium
    writes: true
    role: consumer
    tags: [edge, security]
    preconditions:
      - "Declared staging environment"
      - "Synthetic data only"
    expected_outcome:
      - "Notes are HTML-escaped on display"
    steps:
      - {action: open_section, pattern: "care package|package|service", expected: "Care packages page opens"}
      - {action: click, target: {role: link, name: "Book"}, expected: "Open booking form  # VERIFY"}
      - {action: fill, target: {label: Patient Name}, value: "{{SYNTH_NAME}} {{WF_ID}}", expected: "Name"}
      - {action: fill, target: {label: Phone}, value: "{{SYNTH_PHONE}}", expected: "Phone"}
      - {action: fill, target: {label: Notes}, value: "<b>{{MARKER}}</b>", expected: "HTML in notes"}
      - {action: submit, target: {role: button, name: Request Booking}, expected: "Save"}
      - {action: expect_text, contains: "<b>", expected: "The tag is visible as literal text (output is escaped)"}
      - {action: screenshot, name: edge_04_escaped, expected: "Evidence screenshot (masked)"}

  - id: edge_05_booking_double_click_creates_one
    app: nurseconnect
    title: "Edge: a double click on the submit button creates only one booking"
    description: "Two rapid submits. Exactly one row for this workflow must exist afterwards."
    status: draft
    risk: medium
    writes: true
    role: consumer
    tags: [edge]
    preconditions:
      - "Declared staging environment"
      - "Synthetic data only"
    expected_outcome:
      - "No duplicate booking"
    steps:
      - {action: open_section, pattern: "care package|package|service", expected: "Care packages page opens"}
      - {action: click, target: {role: link, name: "Book"}, expected: "Open booking form  # VERIFY"}
      - {action: fill, target: {label: Patient Name}, value: "{{SYNTH_NAME}} {{WF_ID}}", expected: "Name"}
      - {action: fill, target: {label: Phone}, value: "{{SYNTH_PHONE}}", expected: "Phone"}
      - {action: submit, target: {role: button, name: Request Booking}, expected: "First click  # VERIFY"}
      - {action: click, target: {role: button, name: Request Booking}, expected: "Immediate second click (if the button is still there)", optional: true}
      - {action: open_section, pattern: "booking|appointment|my care|orders", expected: "Bookings list"}
      - {action: expect_count, target: {text: "{{WF_ID}}"}, expected: "Exactly one booking for this workflow", equals: 1}

  - id: edge_06_booking_reload_does_not_resubmit
    app: nurseconnect
    title: "Edge: reloading after a booking does not create a second one"
    description: "Reload twice after submit; the count must stay at one."
    status: draft
    risk: medium
    writes: true
    role: consumer
    tags: [edge]
    preconditions:
      - "Declared staging environment"
      - "Synthetic data only"
    expected_outcome:
      - "Reload is idempotent"
    steps:
      - {action: open_section, pattern: "care package|package|service", expected: "Care packages page opens"}
      - {action: click, target: {role: link, name: "Book"}, expected: "Open booking form  # VERIFY"}
      - {action: fill, target: {label: Patient Name}, value: "{{SYNTH_NAME}} {{WF_ID}}", expected: "Name"}
      - {action: fill, target: {label: Phone}, value: "{{SYNTH_PHONE}}", expected: "Phone"}
