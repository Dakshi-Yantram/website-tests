    description: "STAGING ONLY, DEDICATED ACCOUNT ONLY. Uses env vars LOCKOUT_EMAIL / LOCKOUT_PASSWORD (a throw-away staging account that nobody else uses; it will be locked by this test and may need an unlock before the next run). If the correct password still logs in, there is no per-account lockout."
    status: draft
    risk: medium
    writes: false
    staging_only: true
    timeout_ms: 60000
    tags: [security, brute-force]
    preconditions:
      - "Declared staging environment (never production)"
      - "LOCKOUT_EMAIL / LOCKOUT_PASSWORD point at a dedicated throw-away staging account"
    expected_outcome:
      - "Account lockout or throttling holds against password guessing"
    steps:
      - {action: goto, path: "/auth/login", expected: "Open login  # VERIFY path"}
      - {action: fill, target: {css: 'input[type="email"], input[name*="email" i], input[id*="email" i], input[placeholder*="email" i], input[name*="user" i], input[type="text"]'}, value_env: "LOCKOUT_EMAIL", expected: "Attempt 1: dedicated staging account"}
      - {action: fill, target: {css: 'input[type="password"]'}, value: "{{RUN_ID}}", expected: "Attempt 1: wrong password"}
      - {action: login_submit, target: {role: button, name: Login}, expected: "Attempt 1"}
      - {action: wait_for, ms: 300, expected: "Pause"}
