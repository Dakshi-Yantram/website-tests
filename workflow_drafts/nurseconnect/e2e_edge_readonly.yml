- id: sec_10_login_sql_injection_strings
  app: nurseconnect
  title: 'Security: SQL-injection style input does not log in and does not leak errors'
  description: Classic strings in both fields. The login form must stay, with a generic
    message and no database error text.
  status: draft
  risk: low
  writes: false
  tags:
  - security
  preconditions:
  - No valid credentials used
  expected_outcome:
  - Login refused cleanly
  steps:
  - action: goto
    path: /auth/login
    expected: 'Open login  # VERIFY path (NURSECONNECT_LOGIN_PATH)'
  - action: fill
    target:
      css: input[type="email"], input[name*="email" i], input[id*="email" i], input[placeholder*="email"
        i], input[name*="user" i], input[type="text"]
    value_env: QA_INJECTION_EMAIL
    expected: Injection string in email
  - action: fill
    target:
      css: input[type="password"]
    value_env: QA_INJECTION_PASSWORD
    expected: Injection string in password
  - action: login_submit
    target:
      role: button
      name: Login
    expected: Submit
  - action: expect_visible
    target:
      css: input[type="password"]
    expected: Still on the login form (not authenticated)
  - action: expect_hidden
    target:
      text: syntax error
    expected: No SQL error text
  - action: expect_hidden
    target:
      text: SQLSTATE
    expected: No SQL state text
  - action: expect_hidden
    target:
      text: Internal Server Error
    expected: No server error page
  - action: expect_no_writes_sent
    expected: Nothing was written
- id: sec_11_login_html_script_input
  app: nurseconnect
  title: 'Security: HTML in the login fields is not rendered or reflected'
  description: Submits an image tag as the email; it must not be echoed back as live
    markup.
  status: draft
  risk: low
  writes: false
  tags:
  - security
  preconditions:
  - Declared staging environment
  - Synthetic data only
  expected_outcome:
  - Input is not reflected as markup
  steps:
  - action: goto
    path: /auth/login
    expected: 'Open login  # VERIFY path'
  - action: fill
    target:
      css: input[type="email"], input[name*="email" i], input[id*="email" i], input[placeholder*="email"
        i], input[name*="user" i], input[type="text"]
    value: <img src=x>{{RUN_ID}}
    expected: HTML in email
  - action: fill
    target:
      css: input[type="password"]
    value: '{{RUN_ID}}'
    expected: Throw-away password
  - action: login_submit
    target:
      role: button
      name: Login
    expected: Submit
  - action: expect_visible
    target:
      css: input[type="password"]
    expected: Still on the login form
  - action: expect_count
    target:
      css: img[src=x]
    expected: No injected image element exists
    equals: 0
