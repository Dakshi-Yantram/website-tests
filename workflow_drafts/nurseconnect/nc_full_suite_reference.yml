# NurseConnect agent suite - qa_agent schema v1 (see qa_agent/schema.py + qa_agent/runner.py + docs/WORKFLOW_SCHEMA.md)
#
# Replaces the Gemini draft. That draft used a different schema (api_request, assert_visible, expect_url_contains, login/account,
# full URLs, ${ENV} placeholders, top-level app/name/environments/accounts) that qa_agent rejects at load time.
#
# Rules this file follows (all enforced by `python agent.py validate --file <this file>`):
#   * top level is only `version: 1` + `workflows`
#   * ids match ^[a-z0-9][a-z0-9_-]{2,63}$ and do not collide with workflows.yml, workflows_approved/ or workflow_drafts/
#   * every workflow is `status: draft`; it cannot run until approved:  python agent.py approve --draft <this file> ...
#   * every workflow is `writes: false`: nothing is created, approved, released, paid or sent. Clicks that open modals use
#     guarded_submit (all non-GET requests blocked at the network layer).
#   * credentials come only from the environment via the role (NURSE_EMAIL, CONSUMER_EMAIL, ADMIN_EMAIL, OPS_EMAIL, REVIEWER_EMAIL,
#     SUPPORT_EMAIL and their *_PASSWORD). No URL, host, phone number or password is written in this file.
#   * HTTP/API checks are NOT possible in this schema (the runner has no request action). Use the PowerShell API smoke in the answer.
#
# NOT AUTOMATED ON PURPOSE: payments (agent refuses pay/checkout/refund), real SOS alerts, approve/reject/release buttons.
version: 1
workflows:

  # ====================================================================================================
  # 1. PUBLIC PAGES (anonymous, read-only)
  # ====================================================================================================

  - id: nc_pub_01_home_and_info_pages
    app: nurseconnect
    title: 'Public: home, about, contact and privacy pages render'
    description: 'Anonymous. Opens each public marketing page and checks a heading that only that page has. Read-only.'
    status: draft
    risk: low
    writes: false
    tags: [public, smoke]
    preconditions: ['Public pages reachable']
    expected_outcome: ['Every public page shows its own heading', 'No write request is sent']
    sources:
      - {file: frontend/src/routes/index.tsx}
      - {file: frontend/src/routes/about.tsx}
      - {file: frontend/src/routes/contact.tsx}
      - {file: frontend/src/routes/privacy-policy.tsx}
    timeout_ms: 30000
    steps:
      - {action: goto, path: '/', expected: '/ responds'}
      - {action: expect_visible, target: {role: 'heading', name: 'Our Care Packages'}, expected: 'Home page shows the care-package section'}
      - {action: goto, path: '/about', expected: '/about responds'}
      - {action: expect_visible, target: {text: 'Why Families Choose NurseConnect'}, expected: '''Why Families Choose NurseConnect'' is shown'}
      - {action: goto, path: '/contact', expected: '/contact responds'}
      - {action: expect_visible, target: {text: 'Send us a message'}, expected: '''Send us a message'' is shown'}
      - {action: goto, path: '/privacy-policy', expected: '/privacy-policy responds'}
      - {action: expect_visible, target: {role: 'heading', name: 'Privacy Policy'}, expected: 'Heading ''Privacy Policy'' is shown'}
      - {action: expect_no_writes_sent, expected: 'Nothing was written'}

  - id: nc_pub_02_catalog_list_and_package_detail
    app: nurseconnect
    title: 'Public: /packages and /services list items; first package opens its detail page'
    description: 'Anonymous. Package cards link to /packages/<id>. Opens the first card and checks the detail page offers Book Now (or Enquire now for packages not yet open for online booking). Does not click Book.'
    status: draft
    risk: low
    writes: false
    tags: [public, catalog]
    preconditions: ['At least one active public care package exists']
    expected_outcome: ['Catalogue is populated', 'Detail page opens', 'No booking is started']
    sources:
      - {file: frontend/src/routes/packages.index.tsx}
      - {file: frontend/src/routes/packages.$packageId.tsx}
      - {file: frontend/src/routes/services.index.tsx}
    timeout_ms: 30000
    steps:
      - {action: goto, path: '/packages', expected: '/packages responds'}
      - {action: expect_visible, target: {role: 'heading', name: 'Our Care Packages'}, expected: 'Heading ''Our Care Packages'' is shown'}
      - {action: expect_count, target: {css: 'a[href*=''/packages/'']'}, min: 1, expected: 'At least one package card links to a detail page', timeout_ms: 25000}
      - {action: goto, path: '/services', expected: '/services responds'}
      - {action: expect_visible, target: {text: 'Healthcare services'}, expected: '''Healthcare services'' is shown'}
      - {action: goto, path: '/packages', expected: '/packages responds'}
      - {action: click, target: {css: 'a[href*=''/packages/'']'}, expected: 'Open the first package'}
      - {action: expect_url, matches: '/packages/[^/?#]+', expected: 'Package detail URL'}
      - {action: expect_text, matches: 'book now|enquire now', expected: 'Detail page offers a booking entry point', timeout_ms: 20000}
      - {action: expect_no_writes_sent, expected: 'Nothing was written'}

  - id: nc_pub_03_invalid_verification_link
    app: nurseconnect
    title: 'Public: an invalid /verify/<token> link fails safely'
    description: 'Anonymous. The medicine-verification page is token-only (no login). A made-up token must not crash the page or expose a booking. Read-only (GET /api/verify/<token> only; no upload is attempted).'
    status: draft
    risk: low
    writes: false
    tags: [public, verification, security]
    preconditions: ['No login']
    expected_outcome: ['Page handles an unknown token without a crash']
    sources:
      - {file: frontend/src/routes/verify.$token.tsx}
    timeout_ms: 30000
    steps:
      - {action: goto, path: '/verify/qa-invalid-token-0000', expected: '/verify/qa-invalid-token-0000 responds'}
      - {action: expect_visible, target: {role: 'heading', name: 'NurseConnect'}, expected: 'Heading ''NurseConnect'' is shown'}
      - {action: expect_visible, target: {text: 'Verify your medicines'}, expected: 'Page renders its own title, not a blank screen'}
      - {action: expect_text, matches: 'couldn.t load|expired|invalid|not found|no longer', expected: 'No uploaded document or booking data is shown for an invalid token', timeout_ms: 20000, severity: Low, optional: true}
      - {action: expect_no_writes_sent, expected: 'Nothing was written'}


