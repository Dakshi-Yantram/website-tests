version: 1
workflows:
- id: e2e_01_customer_books_care_package
  app: nurseconnect
  title: 'Customer: choose a care package and request a booking (stops before payment)'
  description: Creates ONE booking request named with the synthetic run name. The
    flow stops before any payment step; the agent never clicks pay/checkout.
  status: draft
  risk: medium
  writes: true
  role: consumer
  tags:
  - chain
  preconditions:
  - Declared staging environment
  - Synthetic data only
  expected_outcome:
  - Server accepts the booking request
  - Booking is listed for the customer
  - No payment is made
  steps:
  - action: open_section
    pattern: care package|package|service
    expected: Care packages page opens
  - action: click
    target:
      role: link
      name: Book
    expected: 'Open the first package''s booking form  # VERIFY'
  - action: fill
    target:
      label: Patient Name
    value: '{{SYNTH_NAME}}'
    expected: 'Synthetic patient name  # VERIFY label'
  - action: fill
    target:
      label: Phone
    value: '{{SYNTH_PHONE}}'
    expected: 'Synthetic phone  # VERIFY label'
  - action: fill
    target:
      label: Notes
    value: '{{MARKER}}'
    expected: 'Marker in notes  # VERIFY label'
  - action: submit
    target:
      role: button
      name: Request Booking
    expected: 'Booking request saved (no payment)  # VERIFY button'
  - action: expect_text
    contains: '{{SYNTH_NAME}}'
    expected: Booking shows the synthetic patient name
  - action: screenshot
    name: e2e_01_booking_created
    expected: Evidence screenshot (masked)
