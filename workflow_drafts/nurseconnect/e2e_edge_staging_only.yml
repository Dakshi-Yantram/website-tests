- id: sec_14_brute_force_unknown_account_is_rate_limited
  app: nurseconnect
  title: 'Security: 10 rapid wrong logins from one browser are throttled (brute-force
    protection)'
  description: STAGING ONLY. Ten failed attempts with a synthetic non-existent account.
    Expect a rate-limit or lockout message by the tenth. FAIL means an attacker can
    guess passwords without being slowed down.
  status: draft
  risk: medium
  writes: false
  staging_only: true
  timeout_ms: 60000
  tags:
  - security
  - brute-force
  preconditions:
  - Declared staging environment (never production)
  - Synthetic account only
  expected_outcome:
  - Throttling or lockout after repeated failures
  steps:
  - action: goto
    path: /auth/login
    expected: 'Open login  # VERIFY path'
  - action: fill
    target:
      css: input[type="email"], input[name*="email" i], input[id*="email" i], input[placeholder*="email"
        i], input[name*="user" i], input[type="text"]
    value: '{{SYNTH_EMAIL}}'
    expected: 'Attempt 1: unknown account'
  - action: fill
    target:
      css: input[type="password"]
    value: '{{RUN_ID}}'
    expected: 'Attempt 1: wrong password'
  - action: login_submit
    target:
      role: button
      name: Login
    expected: Attempt 1
  - action: wait_for
    ms: 300
    expected: Pause
  - action: fill
    target:
      css: input[type="email"], input[name*="email" i], input[id*="email" i], input[placeholder*="email"
        i], input[name*="user" i], input[type="text"]
    value: '{{SYNTH_EMAIL}}'
    expected: 'Attempt 2: unknown account'
  - action: fill
    target:
      css: input[type="password"]
    value: '{{RUN_ID}}'
    expected: 'Attempt 2: wrong password'
  - action: login_submit
    target:
      role: button
      name: Login
    expected: Attempt 2
  - action: wait_for
    ms: 300
    expected: Pause
  - action: fill
