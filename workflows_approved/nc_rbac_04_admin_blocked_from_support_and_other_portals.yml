version: 1
workflows:
- id: nc_rbac_04_admin_blocked_from_support_and_other_portals
  app: nurseconnect
  title: 'RBAC: admin cannot open the support console (SOS / chats) or the consumer,
    partner and operations portals'
  description: Logged in as admin. In rbac.ts the admin role has no support.queue
    permission, so /sos-incidents and /support-desk belong to the support role only.
    Admin must see the Unauthorized boundary there.
  status: approved
  risk: low
  writes: false
  role: admin
  tags:
  - security
  - rbac
  preconditions:
  - ADMIN_EMAIL / ADMIN_PASSWORD set for a test account
  expected_outcome:
  - Unauthorized boundary on every non-admin-portal route
  sources:
  - file: frontend/src/routes/../lib/rbac.ts
  - file: frontend/src/routes/_app.sos-incidents.tsx
  - file: frontend/src/routes/_app.support-desk.tsx
  timeout_ms: 45000
  steps:
  - action: goto
    path: /sos-incidents
    expected: Open /sos-incidents with the wrong role
  - action: expect_visible
    target:
      text: You don't have access to this module
    expected: Unauthorized boundary is shown (role/portal isolation)
    timeout_ms: 20000
  - action: goto
    path: /support-desk
    expected: Open /support-desk with the wrong role
  - action: expect_visible
    target:
      text: You don't have access to this module
    expected: Unauthorized boundary is shown (role/portal isolation)
    timeout_ms: 20000
  - action: goto
    path: /consumer/bookings
    expected: Open /consumer/bookings with the wrong role
  - action: expect_visible
    target:
      text: You don't have access to this module
    expected: Unauthorized boundary is shown (role/portal isolation)
    timeout_ms: 20000
  - action: goto
    path: /partner/visits
    expected: Open /partner/visits with the wrong role
  - action: expect_visible
    target:
      text: You don't have access to this module
    expected: Unauthorized boundary is shown (role/portal isolation)
    timeout_ms: 20000
  - action: goto
    path: /operations/staff
    expected: Open /operations/staff with the wrong role
  - action: expect_visible
    target:
      text: You don't have access to this module
    expected: Unauthorized boundary is shown (role/portal isolation)
    timeout_ms: 20000
  - action: expect_no_writes_sent
    expected: Nothing was written
