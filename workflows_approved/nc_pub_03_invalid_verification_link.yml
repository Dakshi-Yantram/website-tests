version: 1
workflows:
- id: nc_pub_03_invalid_verification_link
  app: nurseconnect
  title: 'Public: an invalid /verify/<token> link fails safely'
  description: Anonymous. The medicine-verification page is token-only (no login).
    A made-up token must not crash the page or expose a booking. Read-only (GET /api/verify/<token>
    only; no upload is attempted).
  status: approved
  risk: low
  writes: false
  tags:
  - public
  - verification
  - security
  preconditions:
  - No login
  expected_outcome:
  - Page handles an unknown token without a crash
  sources:
  - file: frontend/src/routes/verify.$token.tsx
  timeout_ms: 30000
  steps:
  - action: goto
    path: /verify/qa-invalid-token-0000
    expected: /verify/qa-invalid-token-0000 responds
  - action: expect_visible
    target:
      role: heading
      name: NurseConnect
    expected: Heading 'NurseConnect' is shown
  - action: expect_visible
    target:
      text: Verify your medicines
    expected: Page renders its own title, not a blank screen
  - action: expect_text
    matches: couldn.t load|expired|invalid|not found|no longer
    expected: No uploaded document or booking data is shown for an invalid token
    timeout_ms: 20000
    severity: Low
    optional: true
  - action: expect_no_writes_sent
    expected: Nothing was written
