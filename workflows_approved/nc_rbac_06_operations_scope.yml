version: 1
workflows:
- id: nc_rbac_06_operations_scope
  app: nurseconnect
  title: 'RBAC: operations sees staff accounts and FAQ management but not admin dashboards
    or payouts'
  description: 'Logged in as operations. Allowed: /operations/staff, /operations/faq.
    Blocked: /dashboard, /payout-approvals.'
  status: approved
  risk: low
  writes: false
  role: operations
  tags:
  - security
  - rbac
  preconditions:
  - OPS_EMAIL / OPS_PASSWORD set for a test account
  expected_outcome:
  - Operations pages open
  - Admin pages are blocked
  sources:
  - file: frontend/src/routes/../lib/rbac.ts
  - file: frontend/src/routes/_app.operations.staff.tsx
  - file: frontend/src/routes/_app.operations.faq.tsx
  timeout_ms: 45000
  steps:
  - action: goto
    path: /operations/staff
    expected: /operations/staff responds
  - action: expect_visible
    target:
      role: heading
      name: Staff Accounts
    expected: Heading 'Staff Accounts' is shown
  - action: goto
    path: /operations/faq
    expected: /operations/faq responds
  - action: expect_visible
    target:
      role: heading
      name: FAQ Management
    expected: Heading 'FAQ Management' is shown
  - action: goto
    path: /dashboard
    expected: Open /dashboard with the wrong role
  - action: expect_visible
    target:
      text: You don't have access to this module
    expected: Unauthorized boundary is shown (role/portal isolation)
    timeout_ms: 20000
  - action: goto
    path: /payout-approvals
    expected: Open /payout-approvals with the wrong role
  - action: expect_visible
    target:
      text: You don't have access to this module
    expected: Unauthorized boundary is shown (role/portal isolation)
    timeout_ms: 20000
  - action: expect_no_writes_sent
    expected: Nothing was written
