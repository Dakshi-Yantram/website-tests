version: 1
workflows:
- id: edge_08_nurse_empty_documentation_rejected
  app: nurseconnect
  title: 'Edge: nurse cannot save an empty documentation note'
  description: Blocked from writing.
  status: approved
  risk: low
  writes: false
  role: nurse
  tags:
  - edge
  preconditions:
  - e2e_05 ran
  expected_outcome:
  - Empty notes are not stored
  steps:
  - action: open_section
    pattern: Visits
    expected: Visits page opens
  - action: click
    target:
      text: '{{SYNTH_NAME}}'
    expected: Open the synthetic visit
  - action: open_section
    pattern: Documentation
    expected: Documentation tab opens
  - action: fill
    target:
      label: Notes
    value: '{{WF_ID}}'
    expected: Type something
  - action: press
    target:
      label: Notes
    key: Control+a
    expected: Select the text
  - action: press
    target:
      label: Notes
    key: Delete
    expected: Delete it
  - action: guarded_submit
    target:
      role: button
      name: Save
    expected: 'Try to save empty  # VERIFY'
  - action: expect_text
    matches: required|empty|cannot be blank
    expected: Empty-note validation message
  - action: expect_no_writes_sent
    expected: Nothing was sent to the server
