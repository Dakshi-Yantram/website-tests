version: 1
workflows:
- id: e2e_11_nurse_sees_review_feedback
  app: nurseconnect
  title: 'Nurse: the reviewer''s feedback is visible and the note is editable again'
  description: Reviewer -> Nurse hand-off. Read-only.
  status: approved
  risk: low
  writes: false
  role: nurse
  tags:
  - chain
  preconditions:
  - e2e_10 ran
  expected_outcome:
  - Nurse sees the reviewer comment
  steps:
  - action: open_section
    pattern: Documentation
    expected: Documentation page opens
  - action: click
    target:
      text: '{{SYNTH_NAME}}'
    expected: Open the synthetic documentation
  - action: expect_text
    contains: please add vitals
    expected: Reviewer comment is visible to the nurse
  - action: screenshot
    name: e2e_11_feedback_seen
    expected: Evidence screenshot (masked)
