version: 1
workflows:
- id: nc_rev_01_review_queues
  app: nurseconnect
  title: 'Reviewer: nurse approval, onboarding review, prescription review, training
    review open'
  description: Logged in as reviewer. View only.
  status: approved
  risk: low
  writes: false
  role: reviewer
  tags:
  - e2e
  - reviewer
  preconditions:
  - REVIEWER_EMAIL / REVIEWER_PASSWORD set for a test account
  expected_outcome:
  - Reviewer queues open
  sources:
  - file: frontend/src/routes/_app.nurse-approval.tsx
  - file: frontend/src/routes/_app.onboarding-review.tsx
  - file: frontend/src/routes/_app.prescription-review.tsx
  - file: frontend/src/routes/_app.moderation.training.tsx
  timeout_ms: 45000
  steps:
  - action: goto
    path: /nurse-approval
    expected: /nurse-approval responds
  - action: expect_url
    contains: /nurse-approval
    expected: URL still contains /nurse-approval (no redirect to login)
  - action: expect_visible
    target:
      role: heading
      name: My Review Queue
    expected: Heading 'My Review Queue' is shown
  - action: goto
    path: /onboarding-review
    expected: /onboarding-review responds
  - action: expect_url
    contains: /onboarding-review
    expected: URL still contains /onboarding-review (no redirect to login)
  - action: expect_visible
    target:
      text: Applications in Pipeline
    expected: '''Applications in Pipeline'' is shown'
  - action: goto
    path: /prescription-review
    expected: /prescription-review responds
  - action: expect_url
    contains: /prescription-review
    expected: URL still contains /prescription-review (no redirect to login)
  - action: expect_visible
    target:
      css: main
    expected: Page shell renders
  - action: goto
    path: /moderation/training
    expected: /moderation/training responds
  - action: expect_url
    contains: /moderation/training
    expected: URL still contains /moderation/training (no redirect to login)
  - action: expect_visible
    target:
      text: Competency review queue
    expected: '''Competency review queue'' is shown'
  - action: expect_no_writes_sent
    expected: Nothing was written
