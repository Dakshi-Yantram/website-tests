version: 1
workflows:
- id: edge_01_booking_empty_required_fields
  app: nurseconnect
  title: 'Edge: booking form refuses empty required fields (no request is sent)'
  description: All non-GET requests are blocked at the network layer, so this never
    writes.
  status: approved
  risk: low
  writes: false
  role: consumer
  tags:
  - edge
  preconditions:
  - Declared staging environment
  - Synthetic data only
  expected_outcome:
  - Validation blocks the empty form
  steps:
  - action: open_section
    pattern: care package|package|service
    expected: Care packages page opens
  - action: click
    target:
      role: link
      name: Book
    expected: 'Open booking form  # VERIFY'
  - action: guarded_submit
    target:
      role: button
      name: Request Booking
    expected: 'Submit with nothing filled  # VERIFY'
  - action: expect_text
    contains: required
    expected: 'A ''required'' validation message appears  # VERIFY wording'
  - action: expect_no_writes_sent
    expected: Nothing was sent to the server
