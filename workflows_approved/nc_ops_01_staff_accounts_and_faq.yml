version: 1
workflows:
- id: nc_ops_01_staff_accounts_and_faq
  app: nurseconnect
  title: 'Operations: overview, staff accounts and FAQ management open (nothing is
    created)'
  description: Logged in as operations. The Create Staff Account form is only checked
    for presence; it is never submitted.
  status: approved
  risk: low
  writes: false
  role: operations
  tags:
  - e2e
  - ops
  preconditions:
  - OPS_EMAIL / OPS_PASSWORD set for a test account
  expected_outcome:
  - Operations pages open
  - No staff account or FAQ is created
  sources:
  - file: frontend/src/routes/_app.operations.index.tsx
  - file: frontend/src/routes/_app.operations.staff.tsx
  - file: frontend/src/routes/_app.operations.faq.tsx
  timeout_ms: 45000
  steps:
  - action: goto
    path: /operations
    expected: /operations responds
  - action: expect_url
    contains: /operations
    expected: URL still contains /operations (no redirect to login)
  - action: expect_visible
    target:
      text: Manage staff accounts and help-center content
    expected: '''Manage staff accounts and help-center content'' is shown'
  - action: goto
    path: /operations/staff
    expected: /operations/staff responds
  - action: expect_url
    contains: /operations/staff
    expected: URL still contains /operations/staff (no redirect to login)
  - action: expect_visible
    target:
      role: heading
      name: Staff Accounts
    expected: Heading 'Staff Accounts' is shown
  - action: expect_visible
    target:
      text: Create Staff Account
    expected: Create form is present (not submitted)
  - action: goto
    path: /operations/faq
    expected: /operations/faq responds
  - action: expect_url
    contains: /operations/faq
    expected: URL still contains /operations/faq (no redirect to login)
  - action: expect_visible
    target:
      role: heading
      name: FAQ Management
    expected: Heading 'FAQ Management' is shown
  - action: expect_no_writes_sent
    expected: Nothing was written
