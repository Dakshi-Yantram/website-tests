version: 1
workflows:
- id: nc_cons_01_portal_pages
  app: nurseconnect
  title: 'Consumer: home, patients and saved addresses open'
  description: Logged in as consumer. Read-only page loads.
  status: approved
  risk: low
  writes: false
  role: consumer
  tags:
  - e2e
  - consumer
  preconditions:
  - CONSUMER_EMAIL / CONSUMER_PASSWORD set for a test account
  expected_outcome:
  - Each page opens without a login redirect
  sources:
  - file: frontend/src/routes/_app.consumer.index.tsx
  - file: frontend/src/routes/_app.consumer.patients.tsx
  - file: frontend/src/routes/_app.consumer.addresses.tsx
  timeout_ms: 40000
  steps:
  - action: goto
    path: /consumer
    expected: /consumer responds
  - action: expect_url
    contains: /consumer
    expected: URL still contains /consumer (no redirect to login)
  - action: expect_visible
    target:
      text: care stands today
    expected: '''care stands today'' is shown'
  - action: goto
    path: /consumer/patients
    expected: /consumer/patients responds
  - action: expect_url
    contains: /consumer/patients
    expected: URL still contains /consumer/patients (no redirect to login)
  - action: expect_visible
    target:
      text: Your patients
    expected: '''Your patients'' is shown'
  - action: goto
    path: /consumer/addresses
    expected: /consumer/addresses responds
  - action: expect_url
    contains: /consumer/addresses
    expected: URL still contains /consumer/addresses (no redirect to login)
  - action: expect_visible
    target:
      text: Saved addresses
    expected: '''Saved addresses'' is shown'
  - action: expect_no_writes_sent
    expected: Nothing was written
