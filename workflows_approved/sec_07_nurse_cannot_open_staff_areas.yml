version: 1
workflows:
- id: sec_07_nurse_cannot_open_staff_areas
  app: nurseconnect
  title: 'Security: a nurse cannot open operations / reviewer / admin areas'
  description: Paths from the frontend route files. Reaching the page with real content
    is a FAIL; unknown routes show as NOT VERIFIED.
  status: approved
  risk: low
  writes: false
  role: nurse
  tags:
  - security
  preconditions:
  - Declared staging environment
  - Synthetic data only
  expected_outcome:
  - Staff areas are not reachable
  steps:
  - action: goto
    path: /operations
    expected: nurse opens /operations
    optional: true
  - action: expect_url
    matches: ^(?!.*/operations(/|$)).*$
    expected: Not left on /operations
    optional: true
  - action: goto
    path: /nurse-approval
    expected: nurse opens /nurse-approval
    optional: true
  - action: expect_url
    matches: ^(?!.*/nurse-approval(/|$)).*$
    expected: Not left on /nurse-approval
    optional: true
  - action: goto
    path: /reviewer-management
    expected: nurse opens /reviewer-management
    optional: true
  - action: expect_url
    matches: ^(?!.*/reviewer-management(/|$)).*$
    expected: Not left on /reviewer-management
    optional: true
  - action: goto
    path: /roles-permissions
    expected: nurse opens /roles-permissions
    optional: true
  - action: expect_url
    matches: ^(?!.*/roles-permissions(/|$)).*$
    expected: Not left on /roles-permissions
    optional: true
