version: 1
workflows:
- id: nc_admin_01_overview_and_users
  app: nurseconnect
  title: 'Admin: dashboard, live ops, locations, system index, patients and nurses'
  description: Logged in as admin. Read-only page loads.
  status: approved
  risk: low
  writes: false
  role: admin
  tags:
  - e2e
  - admin
  - ops
  preconditions:
  - ADMIN_EMAIL / ADMIN_PASSWORD set for a test account
  expected_outcome:
  - Every admin overview page opens
  sources:
  - file: frontend/src/routes/_app.dashboard.tsx
  - file: frontend/src/routes/_app.ops-dashboard.tsx
  - file: frontend/src/routes/_app.location-dashboard.tsx
  - file: frontend/src/routes/_app.system-index.tsx
  - file: frontend/src/routes/_app.users.patients.tsx
  - file: frontend/src/routes/_app.users.nurses.tsx
  timeout_ms: 60000
  steps:
  - action: goto
    path: /dashboard
    expected: /dashboard responds
  - action: expect_url
    contains: /dashboard
    expected: URL still contains /dashboard (no redirect to login)
  - action: expect_visible
    target:
      role: heading
      name: Booking Trends (7 days)
    expected: Heading 'Booking Trends (7 days)' is shown
  - action: goto
    path: /ops-dashboard
    expected: /ops-dashboard responds
  - action: expect_url
    contains: /ops-dashboard
    expected: URL still contains /ops-dashboard (no redirect to login)
  - action: expect_visible
    target:
      text: Operations command center
    expected: '''Operations command center'' is shown'
  - action: goto
    path: /location-dashboard
    expected: /location-dashboard responds
  - action: expect_url
    contains: /location-dashboard
    expected: URL still contains /location-dashboard (no redirect to login)
  - action: expect_visible
    target:
      role: heading
      name: Location Dashboard
    expected: Heading 'Location Dashboard' is shown
  - action: goto
    path: /system-index
    expected: /system-index responds
  - action: expect_url
    contains: /system-index
    expected: URL still contains /system-index (no redirect to login)
  - action: expect_visible
    target:
      role: heading
      name: Platform Overview
    expected: Heading 'Platform Overview' is shown
  - action: goto
    path: /users/patients
    expected: /users/patients responds
  - action: expect_url
    contains: /users/patients
    expected: URL still contains /users/patients (no redirect to login)
  - action: expect_visible
    target:
      css: main
    expected: Page shell renders
  - action: goto
    path: /users/nurses
    expected: /users/nurses responds
  - action: expect_url
    contains: /users/nurses
    expected: URL still contains /users/nurses (no redirect to login)
  - action: expect_visible
    target:
      css: main
    expected: Page shell renders
  - action: expect_no_writes_sent
    expected: Nothing was written
