version: 1
workflows:
- id: sec_04_customer_cannot_open_nurse_area
  app: nurseconnect
  title: 'Security: a consumer cannot open /partner (broken access control)'
  description: Logs in as consumer then opens /partner directly by URL. The URL must
    leave /partner or an access-denied message must show.
  status: approved
  risk: low
  writes: false
  role: consumer
  tags:
  - security
  preconditions:
  - Declared staging environment
  - Synthetic data only
  expected_outcome:
  - Access denied or redirected
  steps:
  - action: goto
    path: /partner
    expected: Open /partner as consumer
    optional: true
  - action: expect_url
    matches: ^(?!.*/partner(/|$)).*$
    expected: 'Not left on /partner  # FAIL means the area is reachable'
  - action: expect_no_writes_sent
    expected: Nothing was written
