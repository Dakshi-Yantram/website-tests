version: 1
workflows:
- id: edge_02_booking_malformed_phone
  app: nurseconnect
  title: 'Edge: malformed phone numbers are rejected'
  description: Letters and a too-short number. Blocked from writing.
  status: approved
  risk: low
  writes: false
  role: consumer
  tags:
  - edge
  preconditions:
  - Declared staging environment
  - Synthetic data only
  expected_outcome:
  - Invalid phone numbers never reach the server
  steps:
  - action: open_section
    pattern: care package|package|service
    expected: Care packages page opens
  - action: click
    target:
      role: link
      name: Book
    expected: 'Open booking form  # VERIFY'
  - action: fill
    target:
      label: Patient Name
    value: '{{SYNTH_NAME}}'
    expected: 'Name  # VERIFY label'
  - action: fill
    target:
      label: Phone
    value: abc123
    expected: 'Letters in phone  # VERIFY label'
  - action: guarded_submit
    target:
      role: button
      name: Request Booking
    expected: Submit
  - action: expect_text
    matches: phone|mobile|number
    expected: Phone validation message
  - action: fill
    target:
      label: Phone
    value: '12345'
    expected: Too-short number
  - action: guarded_submit
    target:
      role: button
      name: Request Booking
    expected: Submit
  - action: expect_text
    matches: phone|mobile|number|10
    expected: Phone length validation message
  - action: expect_no_writes_sent
    expected: Nothing was sent to the server
