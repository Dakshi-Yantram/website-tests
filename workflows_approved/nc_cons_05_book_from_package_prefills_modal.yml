version: 1
workflows:
- id: nc_cons_05_book_from_package_prefills_modal
  app: nurseconnect
  title: 'Consumer: Book on a package card opens the pre-filled booking modal (writes
    blocked)'
  description: Logged in as consumer. Clicks the first package Book button with all
    writes blocked; the same booking modal must open.
  status: approved
  risk: medium
  writes: false
  role: consumer
  tags:
  - e2e
  - consumer
  - booking
  preconditions:
  - CONSUMER_EMAIL / CONSUMER_PASSWORD set for a test account
  - At least one active care package
  expected_outcome:
  - Modal opens
  - No booking is created
  sources:
  - file: frontend/src/routes/_app.consumer.bookings.tsx
  timeout_ms: 30000
  steps:
  - action: goto
    path: /consumer/bookings
    expected: /consumer/bookings responds
  - action: guarded_submit
    target:
      role: button
      name: Book
      exact: true
    expected: Click Book on the first package with every write blocked
    timeout_ms: 25000
  - action: expect_visible
    target:
      text: New care booking
    expected: Booking modal opens for that package
    timeout_ms: 20000
  - action: expect_no_writes_sent
    expected: No write reached the server
  - action: expect_authenticated
    expected: Session is still signed in
