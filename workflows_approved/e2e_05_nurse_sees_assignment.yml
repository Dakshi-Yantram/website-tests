version: 1
workflows:
- id: e2e_05_nurse_sees_assignment
  app: nurseconnect
  title: 'Nurse: the assignment appears under Workspace > Assignments'
  description: Operations -> Nurse hand-off, nurse side. Read-only.
  status: approved
  risk: low
  writes: false
  role: nurse
  tags:
  - chain
  preconditions:
  - e2e_04 ran
  expected_outcome:
  - Nurse sees exactly the assigned booking
  steps:
  - action: open_section
    pattern: Assignments
    expected: Assignments page opens
  - action: expect_text
    contains: '{{SYNTH_NAME}}'
    expected: Assignment for the synthetic patient is listed
  - action: screenshot
    name: e2e_05_nurse_assignments
    expected: Evidence screenshot (masked)
