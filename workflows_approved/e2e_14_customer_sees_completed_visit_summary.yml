      text: '{{SYNTH_NAME}}'
    expected: Open the booking
  - action: expect_text
    contains: Completed
    expected: 'Booking status reflects completion  # VERIFY wording'
  - action: screenshot
    name: e2e_14_customer_final
    expected: Evidence screenshot (masked)
