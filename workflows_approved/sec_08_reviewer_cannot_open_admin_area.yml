version: 1
workflows:
- id: sec_08_reviewer_cannot_open_admin_area
  app: nurseconnect
  title: 'Security: reviewer cannot open the admin area'
  description: Admin-only page assumed from the route name roles-permissions; confirm
    with the product owner.
  status: approved
  risk: low
  writes: false
  role: reviewer
  tags:
  - security
  preconditions:
  - Declared staging environment
  - Synthetic data only
  expected_outcome:
  - Admin area is admin-only
  steps:
  - action: goto
    path: /roles-permissions
    expected: 'reviewer opens /roles-permissions  # VERIFY: assumed admin-only page'
    optional: true
  - action: expect_url
    matches: ^(?!.*/roles-permissions(/|$)).*$
    expected: Not left on /roles-permissions
    optional: true
