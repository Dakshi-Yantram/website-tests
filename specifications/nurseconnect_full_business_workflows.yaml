workflows:
- id: NC-PUB-001
  module: Public website and discovery
  role: anonymous
  priority: P1
  objective: Homepage is available and public navigation reaches package catalogue
  write_test: false
  source_anchors:
  - /packages
  source_files:
  - frontend/src/routes/packages.index.tsx
  - backend/app/api/v1/public.py
  - backend/app/api/v1/catalog.py
  preconditions:
  - No login required
  - Use staging fixtures and sandbox integrations only; never use production patient data
  - Read-only browser execution; no mutation to customer or provider records
  steps:
  - action: navigate_or_call
    description: 'On /packages, perform: Homepage is available and public navigation reaches package catalogue. Use source-derived
      controls and the specified synthetic fixtures.'
  assertions:
  - description: A family can reach a published care-package list and categories
  - description: The anonymous portal remains on the expected route or shows an intentional validation/authorization
      response, without a fatal client error
  negative_and_boundary_tests:
  - Empty catalogue and API failure show clear empty/error states
  dependencies:
  - Inspect src/routes/packages.index.tsx
  - Inspect backend app/api/v1/public.py
  - Inspect backend app/api/v1/catalog.py
  status: SPECIFIED_NOT_EXECUTED
