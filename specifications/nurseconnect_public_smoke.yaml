schema_version: nurseconnect.agent.workflow.v1
application: nurseconnect
workflows:
- id: S-PUBLIC-PACKAGES
  module: source-anchored-smoke
  role: anonymous
  priority: P1
  objective: Confirm /packages renders its source-defined 'Our Care Packages' section
  write_test: false
  source_anchors:
  - /packages
  source_files:
  - frontend/src/routes/packages.index.tsx
  preconditions:
  - Public page accessible
  - No record changes, messaging, checkout or payments
  steps:
  - action: navigate_or_call
    description: Navigate to /packages and verify literal visible UI text 'Our Care
      Packages'
  assertions:
  - description: Source-defined visible text 'Our Care Packages' is present on /packages
  - description: No fatal client-side rendering prevents this section from displaying
  negative_and_boundary_tests: []
  status: SPECIFIED_NOT_EXECUTED
