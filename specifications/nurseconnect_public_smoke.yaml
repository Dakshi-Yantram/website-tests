- id: S-LOGIN-INPUTS
  module: source-anchored-smoke
  role: anonymous
  priority: P0
  objective: Login page contains an email field, password field, and Login button
  write_test: false
  source_anchors:
  - /auth/login
  source_files:
  - frontend/src/routes/auth.login.tsx
  preconditions:
  - Public login page reachable
  - No credential submission
  steps:
  - action: navigate_or_call
    description: Open login page and inspect user-visible sign-in controls without
      submitting
  assertions:
  - description: Email and password fields are visible
  - description: Login button is visible
  negative_and_boundary_tests: []
  status: SPECIFIED_NOT_EXECUTED
